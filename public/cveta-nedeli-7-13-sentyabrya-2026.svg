<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Цвета недели с 7 по 13 сентября 2026 года</title>
  <desc id="desc">Градиент из семи цветов недели: от светло-голубого до глубокого сапфирового</desc>
  <defs>
    <linearGradient id="week" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EBDC2"/>
      <stop offset="16.67%" stop-color="#67B5B7"/>
      <stop offset="33.33%" stop-color="#006069"/>
      <stop offset="50%" stop-color="#17184B"/>
      <stop offset="66.67%" stop-color="#003221"/>
      <stop offset="83.33%" stop-color="#282B6E"/>
      <stop offset="100%" stop-color="#28285A"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#week)"/>
  <rect width="1200" height="630" fill="url(#shade)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.19">
    <circle cx="1050" cy="80" r="255" stroke-width="2"/>
    <circle cx="1050" cy="80" r="190" stroke-width="2"/>
    <circle cx="1050" cy="80" r="125" stroke-width="2"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#ffffff" filter="url(#shadow)">
    <text x="76" y="250" font-size="34" font-weight="600" letter-spacing="3">ЦВЕТОВОЙ КАЛЕНДАРЬ</text>
    <text x="72" y="340" font-size="72" font-weight="700">Цвета недели</text>
    <text x="76" y="410" font-size="42" font-weight="500">7–13 сентября 2026</text>
  </g>
  <g transform="translate(76 520)">
    <circle cx="0" cy="0" r="15" fill="#6EBDC2" stroke="#ffffff" stroke-opacity="0.65"/>
    <circle cx="45" cy="0" r="15" fill="#67B5B7" stroke="#ffffff" stroke-opacity="0.65"/>
    <circle cx="90" cy="0" r="15" fill="#006069" stroke="#ffffff" stroke-opacity="0.65"/>
    <circle cx="135" cy="0" r="15" fill="#17184B" stroke="#ffffff" stroke-opacity="0.65"/>
    <circle cx="180" cy="0" r="15" fill="#003221" stroke="#ffffff" stroke-opacity="0.65"/>
    <circle cx="225" cy="0" r="15" fill="#282B6E" stroke="#ffffff" stroke-opacity="0.65"/>
    <circle cx="270" cy="0" r="15" fill="#28285A" stroke="#ffffff" stroke-opacity="0.65"/>
  </g>
</svg>
